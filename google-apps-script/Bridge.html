
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOOKAL Backend Bridge</title>
</head>

<body>
  <script>
    (function () {
      "use strict";

      var ALLOWED_ORIGINS = [
        "https://iasjkk.github.io"
      ];

      window.addEventListener("message", function (event) {

        // Accept messages only from the actual parent window.
        if (event.source !== window.parent) {
          return;
        }

        // Validate the sender's origin.
        if (!ALLOWED_ORIGINS.includes(event.origin)) {
          console.warn("KOOKAL Bridge: Origin rejected:", event.origin);
          return;
        }

        var message = event.data || {};

        // Validate message type and request ID.
        if (message.type !== "KOOKAL_BRIDGE_REQUEST") {
          return;
        }

        if (
          typeof message.id !== "string" ||
          !message.id
        ) {
          return;
        }

        var requestId = message.id;
        var responseOrigin = event.origin;

        var method = String(
          message.method || "GET"
        ).toUpperCase();

        var path = String(
          message.path || ""
        );

        // Validate HTTP method.
        if (!["GET", "POST", "PATCH"].includes(method)) {
          sendResponse(
            requestId,
            responseOrigin,
            405,
            { error: "Method not allowed." }
          );
          return;
        }

        // Validate API path.
        if (
          !path ||
          path.startsWith("//") ||
          path.startsWith("http://") ||
          path.startsWith("https://")
        ) {
          sendResponse(
            requestId,
            responseOrigin,
            400,
            { error: "Invalid API path." }
          );
          return;
        }

        // Validate payload.
        var payload = message.payload || {};

        if (
          typeof payload !== "object" ||
          payload === null ||
          Array.isArray(payload)
        ) {
          sendResponse(
            requestId,
            responseOrigin,
            400,
            { error: "Invalid request payload." }
          );
          return;
        }

        // Execute Apps Script backend.
        try {
          google.script.run
            .withSuccessHandler(function (result) {

              var status = (
                result && result.status
              ) ? result.status : 200;

              var body = (
                result && result.body !== undefined
              ) ? result.body : null;

              sendResponse(
                requestId,
                responseOrigin,
                status,
                body
              );

            })
            .withFailureHandler(function (error) {

              sendResponse(
                requestId,
                responseOrigin,
                500,
                {
                  error: error && error.message
                    ? error.message
                    : "Apps Script request failed."
                }
              );

            })
            .bridgeDispatch(
              method,
              path,
              payload
            );

        } catch (error) {

          sendResponse(
            requestId,
            responseOrigin,
            500,
            {
              error: error && error.message
                ? error.message
                : "Unable to execute Apps Script request."
            }
          );

        }

      });

      // Return response to the verified sender.
      function sendResponse(
        id,
        targetOrigin,
        status,
        body
      ) {

        window.parent.postMessage(
          {
            type: "KOOKAL_BRIDGE_RESPONSE",
            id: id,
            status: status,
            body: body
          },
          targetOrigin
        );

      }

    })();
  </script>
</body>
</html>
